<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secuencias Didácticas EpC | Austin Eco</title>
    <link rel="icon" type="image/jpeg" href="austin-eco-bilingual-school-campana-argentina.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="austin-tokens.css">
    <style>
        :root {
            --austin-blue: var(--austin-petroleo);
            --austin-red: var(--austin-naranja);
            --green-dark: var(--austin-lima-oscuro);
            --border: var(--austin-borde);
            --surface: var(--austin-fondo);
            --white: #ffffff;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--austin-fuente);
            background: var(--surface);
            color: var(--austin-texto);
            padding: 32px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 860px;
            background: var(--white);
            border-radius: 10px;
            border-top: 4px solid var(--austin-lima);
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            padding: 36px;
        }

        header {
            border-bottom: 1px solid var(--austin-borde);
            margin-bottom: 24px;
            padding-bottom: 14px;
        }
        header h1 {
            color: var(--austin-blue);
            font-size: 1.3rem;
            font-weight: 800;
            margin: 0;
        }
        header p { color: var(--austin-texto-suave); font-size: 0.8rem; margin-top: 4px; }

        label {
            display: block;
            font-weight: 700;
            font-size: 0.72rem;
            letter-spacing: 0.4px;
            color: var(--austin-blue);
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            border: 2px solid var(--border);
            border-radius: 5px;
            padding: 12px 14px;
            font-size: 0.92rem;
            font-family: inherit;
            color: var(--austin-texto);
            resize: vertical;
            line-height: 1.6;
            transition: border-color 0.15s;
            min-height: 160px;
        }
        textarea:focus { outline: none; border-color: var(--austin-blue); }

        select {
            width: 100%;
            border: 2px solid var(--border);
            border-radius: 5px;
            padding: 10px 12px;
            font-size: 0.9rem;
            font-family: inherit;
            color: var(--austin-texto);
            background: var(--white);
            outline: none;
            transition: border-color 0.15s;
        }
        select:focus { border-color: var(--austin-blue); }

        .optional-badge { text-transform: none; font-weight: 400; color: var(--austin-texto-suave); }

        .campo-edad { max-width: 320px; margin-bottom: 18px; }

        button.btn-main {
            margin-top: 14px;
            background: var(--austin-red);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        @media (max-width: 700px) {
            body {
                padding: 20px 12px;
            }

            .container {
                border-radius: 0;
                box-shadow: none;
                padding: 24px;
            }

            header h1 {
                font-size: 1.15rem;
            }

            .output-wrapper {
                padding: 18px;
            }

            .output-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .btn-copy,
            button.btn-main {
                width: 100%;
                padding: 12px;
            }

            #output-box {
                min-height: 280px;
            }
        }
        button.btn-main:hover { background: var(--austin-naranja-oscuro); }

        /* OUTPUT */
        .output-wrapper {
            margin-top: 28px;
            background: var(--austin-fondo);
            border-radius: 8px;
            padding: 22px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .output-header label {
            color: var(--austin-texto-suave);
            margin: 0;
            font-size: 0.72rem;
        }
        .btn-copy {
            background: var(--austin-blue);
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-copy:hover { background: var(--austin-petroleo-medio); }

        #output-box {
            width: 100%;
            min-height: 260px;
            background: var(--austin-superficie);
            color: var(--austin-texto);
            border: 1px solid var(--austin-borde);
            border-radius: 6px;
            padding: 18px;
            font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
            font-size: 0.88rem;
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            resize: vertical;
        }
        /* Pasos 1 y 2 (estilos base en austin-tokens.css) */
        #btn-paso-1 { margin: 0 0 22px; }
        #btn-paso-2 { margin: 22px 0 6px; }
        #paso-2-flecha { margin: 2px 0 6px; }
    </style>
</head>
<body>

<div class="container">

    <header>
        <h1>Generador de Secuencias Didácticas</h1>
        <p>Marco EpC — Harvard Project Zero &nbsp;|&nbsp; Austin Eco Bilingual School</p>
    </header>

    <div id="del-pud" hidden></div>

    <button type="button" class="paso-btn" id="btn-paso-1" data-estado="actual">
        <span class="paso-num">1</span>
        <span class="paso-texto">Contá qué querés secuenciar</span>
        <span class="paso-estado" id="paso-1-estado"></span>
    </button>
    <div class="form-group campo-edad">
        <label id="label-nivel" for="f-nivel">Edad / Grado del alumno <span class="optional-badge">(opcional)</span></label>
        <select id="f-nivel">
            <option value="">Sin especificar</option>
        </select>
    </div>

    <label for="f-objetivo">Objetivo o tópico a desarrollar</label>
    <textarea id="f-objetivo" rows="6" placeholder="Describí el objetivo de comprensión, tópico generativo, contenidos clave o performances que querés secuenciar..."></textarea>

    <button type="button" class="paso-btn" id="btn-paso-2" data-estado="espera" disabled>
        <span class="paso-num">2</span>
        <span class="paso-texto" id="paso-2-texto">Generar el prompt</span>
    </button>
    <div id="paso-2-flecha" hidden><svg class="paso-flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v14m0 0-6-6m6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    <div class="output-wrapper">
        <div class="output-header">
            <label>Prompt listo para copiar a Gemini</label>
            <button class="btn-copy" onclick="copiar()">Copiar Prompt</button>
        </div>
        <div id="output-box">Completá el campo de arriba y presioná el botón para generar el prompt...</div>
    </div>

</div>

<script src="nivel-inicial.js"></script>
<script src="pud-contexto.js"></script>
<script src="austin-ui.js"></script>
<script src="austin-pasos.js"></script>
<script>
    // ---- Idioma del objetivo (mismo diccionario que generador-tareas.html / index.html) ----

    function contarSenalesIdioma(texto) {
        // Espacios al inicio/final para que las señales " el ", " la ", etc.
        // también matcheen cuando esa palabra es la primera o la última del
        // texto (si no, "El ciclo del agua" no matcheaba " el " por faltarle
        // el espacio previo, y un texto corto terminaba en empate 0 a 0).
        const cuerpo = ' ' + (texto || '').toLowerCase() + ' ';

        const spanishSignals = [
            ' y ', ' de ', ' la ', ' el ', ' los ', ' las ', ' que ', ' para ', ' por ',
            ' con ', ' una ', ' unos ', ' alumno', ' docente', ' unidad', ' materia',
            ' educación', ' enseñanza', ' aprendizaje', ' escuela', ' español'
        ];
        const englishSignals = [
            ' and ', ' of ', ' the ', ' for ', ' with ', ' that ', ' students', ' teachers', ' unit',
            ' subject', ' learning', ' school', ' class', ' english', ' bilingual', ' global', ' science', ' history'
        ];

        const countMatches = (terms) => terms.reduce((count, term) => {
            const regex = new RegExp(term.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&'), 'g');
            return count + ((cuerpo.match(regex) || []).length);
        }, 0);

        return { es: countMatches(spanishSignals), en: countMatches(englishSignals) };
    }

    function detectarIdiomaTexto(texto) {
        const cuerpo = (texto || '').toLowerCase().trim();
        if (!cuerpo) return 'es';
        if (/[áéíóúñ¿¡]/.test(cuerpo)) return 'es';

        const { es, en } = contarSenalesIdioma(cuerpo);
        if (es > en) return 'es';
        if (en > es) return 'en';

        // Empate a cero: sin tildes ni señales claras de ningún idioma, se
        // asume castellano por defecto (idioma principal de la escuela).
        return 'es';
    }

    function bloqueIdiomaSalida(idioma) {
        return idioma === 'en'
            ? `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nIDIOMA DE SALIDA: INGLÉS\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nToda la secuencia generada (títulos, preguntas, actividades y consignas) debe redactarse íntegramente en inglés, sin importar el idioma de estas instrucciones.`
            : `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nIDIOMA DE SALIDA: CASTELLANO\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nToda la secuencia generada debe redactarse íntegramente en castellano.`;
    }

    // ---- Nivel (CEFR si el objetivo está en inglés, edad/grado si está en castellano) ----

    const NIVELES_EN = {
        A1: { label: 'A1 - Beginner', vocabulario: 'High-frequency, everyday words only (colors, family, routines, concrete objects). Avoid abstract terms.', gramatica: 'Present simple, regular plurals, sentences of 3-6 words. No compound tenses, no subordinate clauses.' },
        A2: { label: 'A2 - Elementary', vocabulario: 'Everyday vocabulary plus basic academic terms of the topic, always introduced with a concrete example.', gramatica: 'Past simple and "going to" future. Sentences of 6-9 words with simple connectors (and, but, because).' },
        B1: { label: 'B1 - Intermediate', vocabulario: 'Academic vocabulary of the topic, always introduced in context before being used freely.', gramatica: 'Present perfect, simple subordinate clauses, comparatives/superlatives. Sentences up to 12 words.' },
        B2: { label: 'B2 - Upper Intermediate', vocabulario: 'Academic and abstract vocabulary, including technical terms of the topic without needing translation.', gramatica: 'Passive voice, cause-effect connectors, conditional clauses. Sentences up to 15-18 words with subordination.' },
        C1: { label: 'C1 - Advanced', vocabulario: 'Advanced academic vocabulary, nuanced meaning, idiomatic collocations specific to the topic.', gramatica: 'Complex structures (mixed conditionals, passive voice across tenses), extended argumentation with contrast/qualification connectors.' },
        C2: { label: 'C2 - Proficient', vocabulario: 'Near-native register vocabulary, including connotative nuance and specialized terminology without simplification.', gramatica: 'Full command of complex, varied structures, sophisticated textual cohesion, precise rhetorical argumentation on abstract topics.' }
    };

    const NIVELES_ES = {
        '1° Grado Primaria': { label: '1° Grado Primaria', vocabulario: 'Cotidiano y muy concreto; evitar términos abstractos sin explicarlos primero.', gramatica: 'Oraciones de 4 a 6 palabras, una idea por oración, sin subordinadas.' },
        '2° Grado Primaria': { label: '2° Grado Primaria', vocabulario: 'Cotidiano, con primeras palabras específicas del área siempre acompañadas de un ejemplo concreto.', gramatica: 'Oraciones de 5 a 8 palabras, con conectores simples (y, pero, porque).' },
        '3° Grado Primaria': { label: '3° Grado Primaria', vocabulario: 'Específico del área, siempre explicado en contexto la primera vez que aparece.', gramatica: 'Oraciones de hasta 10 palabras, primeras subordinadas simples.' },
        '4° Grado Primaria': { label: '4° Grado Primaria', vocabulario: 'Específico del área con mayor variedad; se pueden introducir sinónimos y familias de palabras.', gramatica: 'Oraciones de hasta 12 palabras, subordinadas simples y conectores de secuencia (primero, luego, finalmente).' },
        '5° Grado Primaria': { label: '5° Grado Primaria', vocabulario: 'Técnico del área, con primeras nociones de argumentación y comparación.', gramatica: 'Oraciones de hasta 15 palabras, conectores de causa-consecuencia, subordinadas variadas.' },
        '6° Grado Primaria': { label: '6° Grado Primaria', vocabulario: 'Técnico del área y vocabulario académico de transición a secundaria, con nociones de argumentación.', gramatica: 'Oraciones más complejas, conectores de causa-consecuencia y contraste, primeras estructuras de análisis crítico.' },
        '1° Año Secundaria': { label: '1° Año Secundaria', vocabulario: 'Técnico del área, introducido en contexto pero ya sin simplificaciones excesivas; primeras nociones de terminología disciplinar.', gramatica: 'Oraciones de hasta 18 palabras, subordinadas variadas, conectores de causa-consecuencia y contraste.' },
        '2° Año Secundaria': { label: '2° Año Secundaria', vocabulario: 'Técnico consolidado del área, con primeros términos abstractos propios de la disciplina.', gramatica: 'Subordinadas múltiples, voz pasiva, conectores de consecuencia y concesión; inicio de argumentación con evidencia.' },
        '3° Año Secundaria': { label: '3° Año Secundaria', vocabulario: 'Académico y técnico específico, con matices de significado entre términos relacionados.', gramatica: 'Estructuras complejas con varias cláusulas, nexos de contraste y condición; argumentación con postura propia.' },
        '4° Año Secundaria': { label: '4° Año Secundaria', vocabulario: 'Especializado del área, incluyendo terminología de uso profesional o académico.', gramatica: 'Registro formal sostenido, estructuras condicionales y comparativas complejas, síntesis de múltiples fuentes.' },
        '5° Año Secundaria': { label: '5° Año Secundaria', vocabulario: 'Técnico-académico de nivel preuniversitario, con precisión terminológica exigida.', gramatica: 'Argumentación compleja y sostenida, con matización, contraargumentación y uso de evidencia para sustentar posturas.' },
        '6° Año Secundaria': { label: '6° Año Secundaria', vocabulario: 'Académico de transición a nivel universitario, con manejo autónomo de terminología especializada.', gramatica: 'Pensamiento crítico expresado con estructuras sofisticadas, argumentación multicausal y análisis con autonomía total.' }
    };

    function tablaNiveles(idioma) {
        return idioma === 'en' ? NIVELES_EN : NIVELES_ES;
    }

    function sincronizarSelectorNivel(idioma) {
        const select = document.getElementById('f-nivel');
        const label = document.getElementById('label-nivel');
        if (!select || !label) return;
        if (select.dataset.idioma === idioma) return;

        // Las salas existen en los dos idiomas: si había una elegida, se conserva.
        const salaPrevia = esSalaInicial(select.value) ? select.value : '';
        select.dataset.idioma = idioma;
        llenarSelectorNivel(select, tablaNiveles(idioma), idioma === 'en' ? 'Primaria y Secundaria (CEFR)' : 'Primaria y Secundaria');
        select.value = salaPrevia;
        if (!salaPrevia) delete select.dataset.autofilled;

        label.innerHTML = idioma === 'en'
            ? 'Sala o nivel de inglés <span class="optional-badge">(opcional)</span>'
            : 'Sala / Grado del alumno <span class="optional-badge">(opcional)</span>';

        if (window.contextoPUD) aplicarContextoPUD(window.contextoPUD);
    }

    function bloqueNivel(nivel, idioma) {
        if (esSalaInicial(nivel)) {
            return `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n${bloqueCalibracionInicial(nivel, idioma === 'en')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nToda la secuencia (títulos, preguntas, consignas y experiencias) tiene que respetar este nivel.`;
        }
        const info = tablaNiveles(idioma)[nivel];
        if (!info) return null;
        return `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nCALIBRACIÓN POR NIVEL (${info.label})\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n- VOCABULARIO: ${info.vocabulario}\n- GRAMÁTICA/SINTAXIS: ${info.gramatica}\nAjustá la complejidad de las actividades, consignas y preguntas guía de los 5 pasos a este nivel.`;
    }

    function escapeHtml(value = '') {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // ---- Contexto del PUD activo (contrato en pud-contexto.js) ----
    // Secuencias muestra todas las metas y todos los desempeños del PUD.

    window.contextoPUD = null;

    PudContexto.alRecibir(aplicarContextoPUD);

    function aplicarContextoPUD(ctx) {
        PasosPrompt.cambio(); // el contexto del PUD entra en el prompt
        window.contextoPUD = ctx;

        const selectNivel = document.getElementById('f-nivel');
        // Las salas están en el selector de ambos idiomas; los grados, solo en castellano.
        if (ctx?.grado && selectNivel && (selectNivel.dataset.idioma === 'es' || esSalaInicial(ctx.grado))
            && (selectNivel.value === '' || selectNivel.dataset.autofilled === 'true')) {
            const opcion = Array.from(selectNivel.options).find(o => o.value === ctx.grado.trim());
            if (opcion) {
                selectNivel.value = opcion.value;
                selectNivel.dataset.autofilled = 'true';
            }
        }

        PudContexto.renderBloque(document.getElementById('del-pud'), ctx, { filtro: 'todos' });
    }

    function bloqueContextoPUD(ctx) {
        if (!ctx) return null;
        const lineas = [];
        if (ctx.materia) lineas.push(`- Materia/Área: ${ctx.materia}`);
        if (ctx.titulo) lineas.push(`- Unidad didáctica: ${ctx.titulo}`);
        if (ctx.metas?.length) lineas.push(`- Metas de comprensión de la unidad:\n${ctx.metas.map(m => `  · ${m.texto}`).join('\n')}`);
        if (ctx.desempenos?.length) {
            lineas.push(`- Desempeños de comprensión del PUD:\n${ctx.desempenos.map(d => `  · [${PudContexto.TIPOS[d.tipo]}] ${d.texto}`).join('\n')}`);
        }
        if (lineas.length === 0) return null;
        return `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nCONTEXTO DE LA UNIDAD DIDÁCTICA (PUD) ACTIVA\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nTené en cuenta este contexto para que la secuencia sea coherente con la unidad en curso:\n${lineas.join('\n')}`;
    }

    const campoObjetivo = document.getElementById('f-objetivo');
    sincronizarSelectorNivel(detectarIdiomaTexto(campoObjetivo.value));
    // "Cambios sin guardar" = hay un objetivo escrito que todavía no se
    // convirtió en prompt (o cambió desde el último prompt generado).
    let objetivoDelUltimoPrompt = '';
    function avisarSiHayCambios() {
        const actual = campoObjetivo.value.trim();
        PudContexto.avisarCambios(actual !== '' && actual !== objetivoDelUltimoPrompt);
    }

    campoObjetivo.addEventListener('input', () => {
        sincronizarSelectorNivel(detectarIdiomaTexto(campoObjetivo.value));
        avisarSiHayCambios();
    });

    // Si el docente toca el selector a mano, esa elección ya no es "autofill":
    // sin este flag, la próxima vez que llega el contexto del PUD (ej. al
    // volver a esta pestaña) pisaba silenciosamente la elección manual.
    document.getElementById('f-nivel').addEventListener('change', function () {
        delete this.dataset.autofilled;
    });

    function construirPrompt() {
        const objetivo = campoObjetivo.value.trim();
        if (!objetivo) { AustinUI.avisar("Ingresá un objetivo o tópico para armar la secuencia.", { tipo: "error" }); return; }

        const idioma = detectarIdiomaTexto(objetivo);
        const nivel = document.getElementById('f-nivel').value;
        const metaFrase = idioma === 'en' ? 'Students will develop understanding about...' : 'Los estudiantes desarrollarán comprensión sobre...';

        const extras = [bloqueContextoPUD(window.contextoPUD), bloqueIdiomaSalida(idioma), bloqueNivel(nivel, idioma)]
            .filter(Boolean)
            .map(bloque => `\n\n${bloque}`)
            .join('');

        const prompt = esSalaInicial(nivel)
            ? promptSecuenciaInicial(objetivo, extras, nivel, idioma === 'en')
            : promptSecuencia(objetivo, extras, metaFrase);

        document.getElementById('output-box').textContent = prompt;
        objetivoDelUltimoPrompt = objetivo;
        PasosPrompt.generado();
        avisarSiHayCambios();
    }

    // Primaria y Secundaria: los 5 pasos EpC como estructura, desarrollados
    // en 5 a 10 clases de 60 minutos con todo el material para dar cada una
    // (textos, preguntas, rutinas, claves). La IA entrega por partes: el mapa
    // de la secuencia con la clase 1, y una clase más cada vez que el docente
    // escribe «continuar», para que la respuesta no se corte ni se resuma.
    function promptSecuencia(objetivo, extras, metaFrase) {
        return `Actúa como un experto en EpC (Enseñanza para la Comprensión, Harvard Project Zero) con experiencia en planificación didáctica para educación bilingüe.

Tu tarea es diseñar una SECUENCIA DIDÁCTICA completa y lista para dar en el aula, estructurada en los 5 pasos del marco EpC, a partir del siguiente objetivo o tópico:

---
${objetivo}
---${extras}

PRINCIPIO CENTRAL:
- La secuencia es una línea de indagación, no una sucesión de temas sueltos. Se organiza alrededor de una pregunta esencial que plantea un problema intelectual genuino para investigar.
- Cada clase aporta algo necesario para responder esa pregunta. Los alumnos avanzan desde sus saberes previos y supuestos iniciales hacia interpretaciones, conexiones y conclusiones mejor fundamentadas.
- Desarrollá el contenido, no solo la descripción de las actividades. El docente tiene que poder dar cada clase sin preparar materiales ni completar lo que falta. Por ejemplo, en lugar de escribir «Los alumnos leen un texto sobre el patrimonio cultural y responden preguntas», escribí el texto completo, el vocabulario esencial, las preguntas, la clave de respuestas y la consigna que conecta la lectura con la pregunta esencial. Aplicá lo mismo a debates, análisis de fuentes, casos, imágenes e investigaciones.

ESTRUCTURA OBLIGATORIA: 5 PASOS EpC, DE 5 A 10 CLASES DE 60 MINUTOS
Los 5 pasos van en este orden. Cada paso se desarrolla en una o más clases; en total, entre 5 y 10 clases. Cada clase dura 60 minutos (1 hora reloj). Distribuí las clases según el trabajo intelectual que pide cada paso.

PASO 1 — EXPLORACIÓN (Tópico Generativo)
Activación de saberes previos y conexión con la experiencia del alumno. El tópico debe ser genuinamente interesante, central a la disciplina y accesible. Incluí una pregunta generativa potente que abra el pensamiento.

PASO 2 — INVESTIGACIÓN GUIADA (Metas de Comprensión en acción)
Profundización conceptual con andamiaje docente. Las actividades deben apuntar directamente a las metas de comprensión. El alumno no solo recibe información: construye comprensión con apoyo estructurado.

PASO 3 — SÍNTESIS Y CONEXIÓN (Transferencia)
Integración de lo aprendido. El alumno conecta los nuevos conceptos con otros contextos, disciplinas o situaciones reales. Actividades de síntesis visible (mapas, discusiones, comparaciones).

PASO 4 — PRODUCCIÓN (Desempeño de Comprensión visible)
El alumno demuestra su comprensión a través de un producto auténtico y concreto. Debe ser un desempeño real, no una prueba tradicional. Público o propósito real siempre que sea posible.

PASO 5 — EVALUACIÓN FINAL (Valoración Continua + Metacognición)
Reflexión sobre el propio aprendizaje. Criterios de evaluación compartidos con el alumno. Cierre que consolida la comprensión y abre nuevas preguntas.

PROGRESIÓN ENTRE CLASES:
- Diseñá la secuencia completa antes de desarrollar cada clase en detalle.
- La progresión es acumulativa: los conceptos, el vocabulario y la evidencia de clases anteriores se retoman y profundizan cuando corresponde.
- Como guía flexible (no es una secuencia obligatoria de 8 clases): Observar → Preguntar → Comprender → Investigar → Comparar → Aplicar → Evaluar → Concluir. Adaptala a la materia y al tema.
- Evitá la repetición disfrazada de progresión: cada clase nueva presenta un caso nuevo, profundiza un concepto, desafía un supuesto o pide transferir lo comprendido.

FORMA DE ENTREGA: POR PARTES
Primera respuesta:
1. Título de la secuencia.
2. Meta de comprensión central: una oración que comience con "${metaFrase}".
3. Pregunta esencial de la secuencia.
4. Mapa de la secuencia: una tabla con una fila por clase y estas columnas: N.º de clase, paso EpC, qué deben saber ya los alumnos, conocimiento o distinción conceptual nueva, evidencia/ejemplo/experiencia que la hace comprensible, operación de pensamiento que practican, cómo avanza la pregunta esencial y qué evidencia de aprendizaje informa la clase siguiente.
5. La Clase 1 completa.
6. Al final, una línea en el idioma de la secuencia que invite al docente a escribir «continuar» (o «continue») para recibir la Clase 2.
Respuestas siguientes: cada vez que el docente escriba «continuar» o «continue», entregá la clase siguiente completa, fiel al mapa, sin resumir ni acortar, y terminá con la misma línea para la clase que sigue. La última clase (Paso 5) cierra la secuencia: valoración del producto final con sus criterios y reflexión sobre cómo cambió el pensamiento de los alumnos.

CONTENIDO DE CADA CLASE:
- Encabezado: Clase N de T · paso EpC (nombre y subtítulo) · pregunta guía del paso · objetivo de la clase · cómo avanza la pregunta esencial · conexión explícita con el marco EpC.
- Etapas con su duración en minutos, que sumen 60. Asigná el tiempo según el trabajo intelectual: una lectura con análisis de evidencia necesita más tiempo que una actividad de recuperación inicial. No fuerces la misma cantidad de etapas en todas las clases ni cargues más actividades de las que entran en una hora; dejá tiempo para procesar, discutir, responder y reflexionar.
- En cada actividad: qué hace el docente, qué hacen los alumnos (solos, en parejas o con toda la clase), qué busca lograr y la consigna textual para los alumnos.
- Todo el material escrito completo: textos adaptados a la edad, vocabulario esencial cuando sirva, preguntas completas, consignas de discusión, casos y fuentes. Nunca uses consignas vagas como «discutan el tema», «investiguen» o «analicen la fuente» sin dar las preguntas, el material y el proceso.
- Recursos que se proyectan o se usan directo: textos, imágenes, pizarrón, cuaderno, discusión. No pidas tarjetas, recortes, fichas elaboradas, materiales especiales ni disposiciones complicadas del aula.
- Si un recurso no puede ir dentro de la clase, dá un link directo que hayas verificado o una descripción precisa para encontrarlo. Nunca inventes fuentes ni digas que verificaste un link si no pudiste hacerlo.

PREGUNTAS (cuando la actividad las pida), tres tipos complementarios:
A. De comprensión, cerradas: opción múltiple, unir, ordenar, verdadero/falso con corrección o respuesta breve. Se tienen que poder responder con el material dado.
B. Abiertas, de interpretación y conexión: por qué importa algo, comparar casos, causas y consecuencias, conectar ideas, considerar otra perspectiva.
C. De inferencia y evidencia: sacar conclusiones, distinguir hechos de interpretaciones, identificar la evidencia que sostiene una idea, evaluar explicaciones en competencia.
Que avancen de la comprensión al razonamiento: no todas abiertas, pero sin que dominen las de memoria. Incluí la clave de respuestas de las cerradas y, para las abiertas, una respuesta modelo o los criterios de una buena respuesta; aceptá conclusiones distintas si están bien fundamentadas.
Adaptá la complejidad del lenguaje al nivel de los alumnos sin quitar complejidad conceptual: lenguaje simple no significa pensamiento simple. Si la secuencia es en inglés como lengua extranjera, usá inglés accesible, oraciones claras, vocabulario andamiado y sentence starters cuando ayuden.

RUTINAS DE PENSAMIENTO (Project Zero):
Elegí cada rutina según su propósito cognitivo; por ejemplo: See, Think, Wonder; Think, Puzzle, Explore; Tug-of-War; Claim, Support, Question; Circle of Viewpoints; Connect, Extend, Challenge; I Used to Think… Now I Think…; What Makes You Say That? Preferí las que solo necesitan pizarrón, cuaderno y discusión. No las repitas mecánicamente ni las incluyas solo para que la clase parezca de indagación.
Cada vez que uses una, indicá: su propósito, las instrucciones textuales del docente, los prompts textuales que responden los alumnos, qué se hace en forma individual, en parejas o con toda la clase, cómo el docente guía la discusión y qué tiene que buscar en las respuestas.

CASOS, EVIDENCIA Y PERSPECTIVAS:
- En Ciencias Sociales, Historia, Geografía y Ciudadanía, priorizá casos sustantivos que iluminen conceptos más amplios, con contexto histórico, fechas, lugares y actores; fuentes primarias o secundarias; mapas, fotos, objetos, documentos o datos; interpretaciones en disputa y dilemas éticos o sociales cuando existan; conexiones con el contexto de los alumnos; y momentos para distinguir hechos establecidos de afirmaciones discutidas.
- No fabriques controversia donde no hace falta. En temas disputados (hechos históricos, soberanía, propiedad), presentá las perspectivas con equidad y exactitud, sin dar opiniones sin respaldo como hechos ni poner al mismo nivel posiciones con distinto respaldo en la evidencia.
- En las demás materias, aplicá el mismo principio de evidencia sustantiva e indagación con los métodos propios de la disciplina.

IMÁGENES:
Cuando una imagen mejore el aprendizaje, usala como recurso y no como decoración. Para cada actividad con imagen: la imagen, una fuente directa verificada o una descripción de búsqueda precisa; el contexto necesario para interpretarla; consignas de observación concretas; preguntas que distingan lo que se ve de lo que se infiere; y la conexión con el objetivo de la clase. Preferí imágenes reales: objetos, sitios históricos, mapas, documentos, fenómenos científicos. Nunca le pidas al docente que arme una colección de imágenes o tarjetas.

EVALUACIÓN FORMATIVA:
- Integrala en todas las clases: preguntas de recuperación, respuestas a una lectura, justificación oral, ejercicios de afirmación y evidencia, comparaciones, tickets de salida, conclusiones breves escritas o reflexión sobre cómo cambió el propio pensamiento.
- Para cada instancia, indicá qué comprensión o error frecuente chequea el docente y cómo el resultado influye en la clase siguiente.
- El producto final (Paso 4) demuestra lo aprendido en toda la secuencia: por ejemplo, una recomendación fundamentada en evidencia, un expediente de caso, una comparación, una propuesta o una presentación.
- Evaluá la calidad de la comprensión, la evidencia y el razonamiento, no la presentación artística ni la cantidad de texto escrito.

CONTROL DE CALIDAD ANTES DE ENTREGAR CADA PARTE (no lo muestres; si algo no se cumple, corregilo antes de responder):
- La pregunta esencial guía la secuencia y las clases forman una progresión coherente.
- Cada clase tiene contenido sustantivo: textos, preguntas y actividades completos.
- Hay equilibrio entre preguntas cerradas de comprensión y preguntas de razonamiento.
- Las rutinas de pensamiento están desarrolladas, no solo nombradas.
- Las imágenes y los recursos externos se pueden usar.
- Los tiempos son realistas y suman 60 minutos por clase.
- El docente casi no necesita preparar nada.
- Hay claves de respuestas y criterios de evaluación donde hacen falta.
- Actividades, objetivos y evaluación están alineados.
- Los alumnos aplican, conectan y revisan su pensamiento.
- El producto final sintetiza lo aprendido en la secuencia.

El output debe estar listo para usar en el aula, con lenguaje claro y preciso. No agregues introducciones ni aclaraciones metodológicas dirigidas al docente fuera del formato solicitado.`;
    }

    // Jardín: los mismos 5 pasos EpC, traducidos a momentos de juego para
    // la sala. Las reglas generales (duración, consignas, prohibiciones,
    // lenguaje) vienen de nivel-inicial.js.
    function promptSecuenciaInicial(objetivo, extras, sala, esIngles) {
        const v = EJECUCION_INICIAL[sala];
        return `Actúa como una docente experta en Nivel Inicial (Jardín), formada en EpC (Enseñanza para la Comprensión, Harvard Project Zero) y con experiencia en educación bilingüe.

Tu tarea es generar una SECUENCIA DE EXPERIENCIAS PARA LA SALA en exactamente 5 momentos, a partir del siguiente tópico:

---
${objetivo}
---${extras}

${bloqueReglasInicial(sala, esIngles)}

ESTRUCTURA OBLIGATORIA DE LOS 5 MOMENTOS:

MOMENTO 1 — INVITACIÓN (Tópico generativo hecho juego)
Un objeto sorpresa, un títere, una canción o una ronda que despierte curiosidad. Incluí la pregunta que abre el juego.

MOMENTO 2 — EXPLORACIÓN (Metas de comprensión en acción)
Los niños exploran con los sentidos y con el cuerpo. La docente acompaña con preguntas y comentarios, no explica ni da definiciones.

MOMENTO 3 — JUEGO Y CONEXIÓN (Transferencia)
Juego simbólico o en rincones donde usan lo que descubrieron en otra situación (la casita, el mercado, la granja, la huerta).

MOMENTO 4 — CREACIÓN (Desempeño de comprensión visible)
Una producción concreta hecha jugando: una construcción, una pintura grande, una dramatización, una canción inventada, un mural entre todos.

MOMENTO 5 — RONDA DE CIERRE (Valoración continua)
Una ronda breve de "¿qué descubrimos?", documentación con fotos o audios y algo para compartir con las familias. Sin evaluaciones escritas ni calificaciones.

FORMATO DE ENTREGA:
Para cada momento incluí:
- Nombre con tono de juego
- Duración (${v.minutos} minutos por experiencia)
- Pregunta guía, como la diría un chico de ${v.edad}
- 1 o 2 experiencias concretas, con la consigna oral textual que la docente les dice a los niños
- Materiales necesarios (seguros para la edad)
- Qué observa la docente durante el juego (en lugar de "cómo se evalúa")
- Conexión con el marco EpC, en una línea

Al inicio del documento indicá:
- Título de la secuencia (máximo 4 palabras, con tono de juego o de cuento)
- Meta de comprensión central (una oración que comience con "${metaInicial(esIngles)}")

El output debe estar listo para usar en la sala, con lenguaje simple y cálido. No agregues introducciones ni fundamentación teórica fuera del formato solicitado.`;
    }

    async function copiar() {
        const box = document.getElementById('output-box');
        const btn = document.querySelector('.btn-copy');
        const texto = box.textContent;

        if (texto.startsWith("Completá")) { AustinUI.avisar("Primero generá el prompt; después podés copiarlo.", { tipo: "error" }); return; }

        try {
            await navigator.clipboard.writeText(texto);
        } catch {
            const ta = document.createElement('textarea');
            ta.value = texto;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        }

        const orig = btn.textContent;
        btn.textContent = "¡Copiado!";
        btn.style.background = "var(--austin-lima-oscuro)";
        setTimeout(() => { btn.textContent = orig; btn.style.background = ""; }, 1500);
    }
</script>
